{% extends 'base.html' %}

{% block title %}404 — Page Not Found — Khushi Collection{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24 text-center space-y-6">
    <div class="w-24 h-24 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-amber-400 mx-auto text-4xl shadow-xl">
        <i class="fa-solid fa-compass"></i>
    </div>
    <span class="text-xs font-bold uppercase tracking-widest text-amber-400">404 Error</span>
    <h1 class="text-3xl font-serif font-bold text-white">Piece Not Found</h1>
    <p class="text-xs text-zinc-400 leading-relaxed">
        The luxury collection or page you are seeking might have been moved or is currently unavailable.
    </p>
    <a href="{{ url_for('storefront.home') }}" class="inline-block px-8 py-3.5 rounded-full btn-gold text-xs font-bold uppercase tracking-widest shadow-xl">
        Return to Home
    </a>
</div>
{% endblock %}
