{% extends 'base.html' %}

{% block title %}Server Error — Khushi Collection{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24 text-center space-y-6">
    <div class="w-24 h-24 rounded-full bg-rose-950/60 border border-rose-500/40 text-rose-400 flex items-center justify-center mx-auto text-4xl shadow-xl">
        <i class="fa-solid fa-server"></i>
    </div>
    <span class="text-xs font-bold uppercase tracking-widest text-rose-400">500 Error</span>
    <h1 class="text-3xl font-serif font-bold text-white">Temporary Atelier Interruption</h1>
    <p class="text-xs text-zinc-400 leading-relaxed">
        Our concierge technical team has been notified and is attending to this immediately. Please try again shortly.
    </p>
    <a href="{{ url_for('storefront.home') }}" class="inline-block px-8 py-3.5 rounded-full btn-gold text-xs font-bold uppercase tracking-widest shadow-xl">
        Return to Home
    </a>
</div>
{% endblock %}
