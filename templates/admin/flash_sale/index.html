{% extends 'admin/base.html' %}

{% block title %}Flash Sale Manager — Khushi Collection Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="pb-4 border-b border-zinc-800">
        <h1 class="text-2xl font-serif font-bold text-white">Flash Sale Management</h1>
        <p class="text-xs text-zinc-400 mt-1">Configure global store countdown timers, promotional banners, and flash sale discounts</p>
    </div>

    <div class="luxury-card p-6 sm:p-8 rounded-3xl space-y-6">
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Flash Sale Title</label>
                <input type="text" name="title" required value="{{ sale.title if sale else '🔥 KHUSHI GRAND FLASH SALE' }}" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Subtitle / Description</label>
                <input type="text" name="subtitle" value="{{ sale.subtitle if sale else 'Up to 40% OFF on Luxury Pret, Formal Shawls & Timepieces.' }}" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Discount Percentage (%)</label>
                    <input type="number" name="discount_percentage" required value="{{ sale.discount_percentage if sale else 40 }}" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Sale Expiry Date & Time</label>
                    <input type="datetime-local" name="end_time" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Promotional Banner Image URL</label>
                <input type="url" name="banner_image" value="{{ sale.banner_image if sale else '' }}" placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>

            <div class="pt-2">
                <label class="flex items-center gap-2 text-xs text-zinc-200 font-bold cursor-pointer">
                    <input type="checkbox" name="is_active" value="1" {% if not sale or sale.is_active %}checked{% endif %} class="accent-amber-400">
                    <span>Activate Flash Sale Countdown Widget on Storefront</span>
                </label>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl btn-gold text-xs font-bold uppercase tracking-wider shadow-xl mt-4">
                Save Flash Sale Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
