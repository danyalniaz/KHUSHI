<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied — Khushi Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#080B11] text-zinc-100 min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full p-8 rounded-3xl luxury-card border-rose-500/30 text-center space-y-4 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-500 flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-serif font-bold text-white">ACCESS DENIED (403)</h1>
        <p class="text-xs text-zinc-400 leading-relaxed">
            Your account is recognized as a customer. Customer accounts cannot access the administrative operations studio.
        </p>
        <div class="pt-4 flex items-center justify-center gap-3">
            <a href="/" class="px-6 py-2.5 rounded-xl btn-gold text-xs font-bold uppercase tracking-widest shadow">
                Return to Storefront
            </a>
            <a href="{{ url_for('admin.admin_logout') }}" class="px-4 py-2.5 rounded-xl border border-zinc-700 hover:border-zinc-500 text-zinc-300 text-xs font-bold uppercase">
                Logout
            </a>
        </div>
    </div>
</body>
</html>
