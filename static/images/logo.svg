<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#FFF1B8" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFF1B8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown / Fashion Crest Symbol -->
  <g transform="translate(15, 12)" filter="url(#subtleGlow)">
    <!-- Stylized Crown & Diamond Petals -->
    <path d="M 32 6 L 42 22 L 56 12 L 48 38 L 16 38 L 8 12 L 22 22 Z" fill="url(#goldGrad)" stroke="#B38728" stroke-width="0.8"/>
    <!-- Center Jewel Star -->
    <circle cx="32" cy="22" r="3.5" fill="#FFFBEB" />
    <polygon points="32,15 34,21 40,22 34,23 32,29 30,23 24,22 30,21" fill="#FFF"/>
    <!-- Elegant Base Pedestal -->
    <rect x="14" y="41" width="36" height="3" rx="1.5" fill="url(#goldGrad)"/>
    <circle cx="32" cy="49" r="1.5" fill="#D4AF37"/>
  </g>

  <!-- Brand Typography -->
  <!-- "KHUSHI" -->
  <text x="82" y="44" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="5" 
        fill="url(#goldGrad)">
    KHUSHI
  </text>
  
  <!-- "COLLECTION" -->
  <text x="84" y="66" 
        font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="9" 
        fill="#A1A1AA">
    COLLECTION
  </text>

  <!-- Small Luxury Accent Line -->
  <line x1="285" y1="62" x2="330" y2="62" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
