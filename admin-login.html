<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owner Portal — Khushi Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        .gold-gradient-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
            color: #000;
        }
        .gold-gradient-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-[#080B11] text-zinc-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-black">

    <div class="max-w-md w-full my-6 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-400/10 border border-amber-400/30 text-amber-400 text-2xl shadow-2xl mb-1 hover:scale-105 transition">
                <i class="fa-solid fa-crown"></i>
            </a>
            <h1 class="text-2xl font-serif font-extrabold tracking-wider text-white">KHUSHI COLLECTION</h1>
            <p class="text-xs uppercase font-bold tracking-widest text-amber-400">Private Owner Portal</p>
        </div>

        <!-- Login Card -->
        <div class="luxury-card p-6 sm:p-8 rounded-3xl border border-amber-500/30 shadow-2xl space-y-5">
            
            <!-- Auth Method Switcher Tabs (Password vs PIN) -->
            <div class="flex rounded-xl bg-zinc-950 p-1 border border-zinc-800 text-xs">
                <button type="button" onclick="switchTab('password')" id="tab-pass-btn" class="flex-1 py-2 rounded-lg font-bold transition bg-amber-400 text-black">
                    <i class="fa-solid fa-key mr-1"></i> Email & Password
                </button>
                <button type="button" onclick="switchTab('pin')" id="tab-pin-btn" class="flex-1 py-2 rounded-lg font-bold text-zinc-400 hover:text-white transition">
                    <i class="fa-solid fa-lock mr-1"></i> Quick PIN
                </button>
            </div>

            <!-- Standard Password Form -->
            <form id="pass-login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1.5">Owner Email Address *</label>
                    <div class="relative">
                        <input type="email" id="login-email" required value="admin@khushicollection.com" placeholder="admin@khushicollection.com" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-amber-400 text-xs">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-zinc-400"></i>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-zinc-300 mb-1.5">Password *</label>
                    <div class="relative">
                        <input type="password" id="login-password" required value="Admin@12345" placeholder="••••••••••••" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl py-3 pl-10 pr-10 text-white focus:outline-none focus:border-amber-400 text-xs font-mono">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-zinc-400"></i>
                        <button type="button" onclick="togglePassVisibility('login-password', this)" class="absolute right-3.5 top-3.5 text-zinc-400 hover:text-white p-1">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div id="login-error-alert" class="hidden p-3 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-300 text-xs">
                    <div class="flex items-center gap-2 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> <span>Access Denied</span></div>
                    <p class="text-[11px] text-rose-200 mt-1" id="login-error-msg"></p>
                </div>

                <button type="submit" id="login-submit-btn" class="w-full py-4 rounded-xl gold-gradient-btn text-xs font-extrabold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl cursor-pointer">
                    <i class="fa-solid fa-shield-halved text-xs"></i>
                    <span>Log In to Admin Portal</span>
                </button>
            </form>

            <!-- Quick PIN Form (Mobile Super-Fast Access) -->
            <form id="pin-login-form" onsubmit="handlePinLogin(event)" class="hidden space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-zinc-300 mb-1.5">Owner Security PIN *</label>
                    <div class="relative">
                        <input type="password" id="login-pin" maxlength="6" placeholder="Enter 4-6 digit PIN (e.g. 8899)" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-amber-400 text-sm tracking-widest font-mono text-center">
                        <i class="fa-solid fa-hashtag absolute left-3.5 top-3.5 text-zinc-400"></i>
                    </div>
                    <p class="text-[10px] text-zinc-500 mt-1 text-center">Default Master Owner PIN is <strong class="text-amber-400">8899</strong></p>
                </div>

                <div id="pin-error-alert" class="hidden p-3 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs"></div>

                <button type="submit" class="w-full py-4 rounded-xl gold-gradient-btn text-xs font-extrabold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl cursor-pointer">
                    <i class="fa-solid fa-bolt text-xs"></i>
                    <span>Authenticate with PIN</span>
                </button>
            </form>

            <!-- 1-Tap Auto Fill Demo Helper -->
            <div class="pt-2 border-t border-zinc-800/80 text-center">
                <button type="button" onclick="autoFillDefaultOwner()" class="text-[11px] text-amber-400 hover:text-amber-300 font-semibold underline flex items-center justify-center gap-1.5 mx-auto py-1">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 1-Tap Fill Default Credentials (admin@khushicollection.com)
                </button>
            </div>

        </div>

        <!-- Footer Notice -->
        <div class="text-center text-xs text-zinc-500 space-y-2">
            <p>Protected by end-to-end authorization & role security.</p>
            <a href="index.html" class="inline-flex items-center gap-1.5 text-amber-400 hover:text-amber-300 font-bold transition">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Return to Customer Storefront
            </a>
        </div>

    </div>

    <!-- Scripts -->
    <script src="store.js"></script>
    <script>
        function switchTab(mode) {
            const passForm = document.getElementById('pass-login-form');
            const pinForm = document.getElementById('pin-login-form');
            const passBtn = document.getElementById('tab-pass-btn');
            const pinBtn = document.getElementById('tab-pin-btn');

            if (mode === 'pin') {
                passForm.classList.add('hidden');
                pinForm.classList.remove('hidden');
                pinBtn.className = 'flex-1 py-2 rounded-lg font-bold transition bg-amber-400 text-black';
                passBtn.className = 'flex-1 py-2 rounded-lg font-bold text-zinc-400 hover:text-white transition';
            } else {
                passForm.classList.remove('hidden');
                pinForm.classList.add('hidden');
                passBtn.className = 'flex-1 py-2 rounded-lg font-bold transition bg-amber-400 text-black';
                pinBtn.className = 'flex-1 py-2 rounded-lg font-bold text-zinc-400 hover:text-white transition';
            }
        }

        function togglePassVisibility(id, btn) {
            const input = document.getElementById(id);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash text-xs"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye text-xs"></i>';
            }
        }

        function autoFillDefaultOwner() {
            document.getElementById('login-email').value = 'admin@khushicollection.com';
            document.getElementById('login-password').value = 'Admin@12345';
            document.getElementById('login-pin').value = '8899';
            showToast('Loaded Default Owner Credentials');
        }

        function handleLogin(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error-alert');
            const errMsg = document.getElementById('login-error-msg');

            const res = store.login(email, pass);
            if (res.success) {
                showToast(`Welcome back! Authenticated as ${res.user.role}.`);
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 300);
            } else {
                errBox.classList.remove('hidden');
                errMsg.textContent = res.message;
            }
        }

        function handlePinLogin(e) {
            if (e) e.preventDefault();
            const pin = document.getElementById('login-pin').value.trim();
            const errBox = document.getElementById('pin-error-alert');

            const res = store.login('admin@khushicollection.com', pin);
            if (res.success) {
                showToast(`PIN Verified! Redirecting to Dashboard...`);
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 300);
            } else {
                errBox.classList.remove('hidden');
                errBox.textContent = res.message || 'Incorrect PIN entered.';
            }
        }

        function showToast(msg) {
            let toast = document.getElementById('kc-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'kc-toast';
                toast.className = 'fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl bg-zinc-900 border border-amber-500/40 text-amber-300 text-xs font-bold shadow-2xl transition-all duration-300 transform translate-y-10 opacity-0 flex items-center gap-2';
                document.body.appendChild(toast);
            }
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-amber-400"></i> ${msg}`;
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            store.init();
            const currentUser = store.getCurrentUser ? store.getCurrentUser() : null;
            if (currentUser && ['OWNER', 'MANAGER', 'STAFF'].includes(currentUser.role)) {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
